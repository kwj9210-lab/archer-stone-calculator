<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>궁수키우기 RPG 계산기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:#f4fff8;color:#29463b}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{flex:none;position:sticky;top:0;z-index:10;background:rgba(252,255,253,.94);border-bottom:1px solid #cfe9d9;padding:9px 12px;box-shadow:0 4px 16px rgba(69,126,98,.10);backdrop-filter:blur(10px)}
.bar{max-width:1060px;margin:auto;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.title{font-weight:950;font-size:17px;white-space:nowrap;color:#22694f;letter-spacing:-.4px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%}
.tabs button{
  --tab:#35c98c;--tab2:#54cbd6;--wash:#f3fcf7;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:0;
  min-width:0;min-height:46px;padding:6px 9px;
  border:1px solid color-mix(in srgb,var(--tab) 35%,#dbeae2);
  border-radius:14px;background:linear-gradient(180deg,#fff,var(--wash));
  color:#4d6c60;font-weight:900;cursor:pointer;
  box-shadow:0 2px 8px rgba(58,108,85,.07);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
}
.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:99px 99px 0 0;background:linear-gradient(90deg,var(--tab),var(--tab2));opacity:.42}
.tabs button:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(58,108,85,.11)}
.tabs button.active{
  color:#47665a;
  border:1px solid color-mix(in srgb,var(--tab) 42%,#dbeae2);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--tab) 7%,#ffffff),
    color-mix(in srgb,var(--tab2) 5%,#ffffff));
  box-shadow:
    0 3px 9px rgba(58,108,85,.09),
    inset 0 0 0 1px rgba(255,255,255,.72);
}
.tabs button.active::after{
  opacity:.8;
  height:3px;
  left:12px;
  right:12px;
}
#tabEngrave{--tab:#2fbe86;--tab2:#4fc9c4;--wash:#effbf5}
#tabCraft{--tab:#d99b35;--tab2:#efbf54;--wash:#fff9e7}
#tabStone{--tab:#459bcf;--tab2:#64c4df;--wash:#eff9fe}
#tabTower{--tab:#7b78cf;--tab2:#a092e6;--wash:#f5f3ff}
#tabTrial{--tab:#cb6e96;--tab2:#e79ab3;--wash:#fff2f7}
#tabTraining{--tab:#e18755;--tab2:#e8b15f;--wash:#fff7ef}
#tabSanctuary{--tab:#38a86f;--tab2:#6bcf9d;--wash:#f0fbf5}
#tabOpening{--tab:#bf8a39;--tab2:#e6c27c;--wash:#fff9ec}
#tabPenetration{--tab:#1b9e83;--tab2:#79d6a6;--wash:#f1fff9}
.tab-label{min-width:0;line-height:1.1}
.short{display:none}
main{flex:1;min-height:0}
iframe{width:100%;height:100%;border:0;display:none;background:white}
iframe.active{display:block}
@media(max-width:600px){
header{padding:6px 7px 7px}
.bar{display:block}
.title{display:none}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  width:100%;
}
.tabs button{
  min-width:0;
  min-height:44px;
  padding:5px 5px;
  border-radius:12px;
  gap:0;
  font-size:12px;
  line-height:1.1;
  white-space:nowrap;
  box-shadow:0 2px 7px rgba(58,108,85,.06);
}
.tabs button::after{left:9px;right:9px;height:2px}
.tabs button{grid-column:auto}
.tabs button.active{box-shadow:0 3px 8px rgba(58,108,85,.08),inset 0 0 0 1px rgba(255,255,255,.72)}
.full{display:none}
.short{display:inline}
}

@media(max-width:360px){
.tabs{gap:4px}
.tabs button{min-height:42px;padding:4px 3px;font-size:11px;gap:0}
}
</style>
</head>
<body>
<header><div class="bar"><div class="title">궁수키우기 RPG 계산기</div><div class="tabs">
<button id="tabEngrave" class="active" type="button"><span class="tab-label"><span class="full">각인석 계산기</span><span class="short">각인석</span></span></button>
<button id="tabCraft" type="button"><span class="tab-label"><span class="full">제작시간</span><span class="short">제작시간</span></span></button>
<button id="tabTraining" type="button"><span class="tab-label"><span class="full">수련장</span><span class="short">수련장</span></span></button>
<button id="tabStone" type="button"><span class="tab-label"><span class="full">초월석 시뮬레이터</span><span class="short">초월석</span></span></button>
<button id="tabTower" type="button"><span class="tab-label"><span class="full">초월의 탑</span><span class="short">초월의 탑</span></span></button>
<button id="tabPenetration" type="button"><span class="tab-label"><span class="full">관통 Total</span><span class="short">관통 Total</span></span></button>
<button id="tabSanctuary" type="button"><span class="tab-label"><span class="full">오행의 성역</span><span class="short">오행의성역</span></span></button>
<button id="tabOpening" type="button"><span class="tab-label"><span class="full">오행 개방</span><span class="short">오행개방</span></span></button>
<button id="tabTrial" type="button"><span class="tab-label"><span class="full">시련의 관문</span><span class="short">시련의 관문</span></span></button>
</div></div></header>
<main>
<iframe id="engrave" class="active" src="index.html" title="각인석 계산기"></iframe>
<iframe id="craft" src="crafttime.html" title="마석 제작시간 계산기"></iframe>
<iframe id="stone" src="transcend.html" title="초월석 시뮬레이터"></iframe>
<iframe id="tower" src="tower.html" title="초월의 탑"></iframe>
<iframe id="trial" src="trial.html" title="시련의 관문"></iframe>
<iframe id="training" src="training.html" title="수련장"></iframe>
<iframe id="sanctuary" src="sanctuary.html" title="오행의 성역"></iframe>
<iframe id="opening" src="opening.html" title="오행 개방"></iframe>
<iframe id="penetration" src="penetration.html" title="관통 Total"></iframe>
</main>
<script>
const tabs=[
 ["engrave","tabEngrave"],["craft","tabCraft"],["training","tabTraining"],
 ["stone","tabStone"],["tower","tabTower"],["penetration","tabPenetration"],
 ["sanctuary","tabSanctuary"],["opening","tabOpening"],["trial","tabTrial"]
];
const frames=Object.fromEntries(tabs.map(([id])=>[id,document.getElementById(id)]));
const buttons=Object.fromEntries(tabs.map(([id,button])=>[id,document.getElementById(button)]));
let pendingTowerPen=null;
function handoffToTower(value){
 if(!Number.isSafeInteger(value)||value<0)return;
 pendingTowerPen=value;
 try{localStorage.setItem("archer:tower:handoff",String(value));}catch(_){}
 if(frames.tower.contentWindow){
   frames.tower.contentWindow.postMessage({type:"archer:set-tower-penetration",penetration:value},location.origin);
 }
}
function show(which){
 if(!frames[which])return;
 for(const [id] of tabs){
   frames[id].classList.toggle("active",id===which);
   buttons[id].classList.toggle("active",id===which);
 }
 if(history.replaceState)history.replaceState(null,"","#"+which);
 if(which==="tower"&&pendingTowerPen!==null)handoffToTower(pendingTowerPen);
}
for(const [id] of tabs)buttons[id].onclick=()=>show(id);
frames.tower.addEventListener("load",()=>{
 if(pendingTowerPen!==null)handoffToTower(pendingTowerPen);
});
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||event.source!==frames.penetration.contentWindow)return;
 if(!event.data||event.data.type!=="archer:penetration-total")return;
 const value=event.data.penetration;
 if(!Number.isSafeInteger(value)||value<0)return;
 handoffToTower(value);
 show("tower");
});
const init=decodeURIComponent((location.hash||"").replace(/^#/,""));
if(frames[init])show(init);
</script>

</body></html>
