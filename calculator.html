<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>궁수키우기 RPG 계산기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:#f4fff8;color:#29463b}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{flex:none;position:sticky;top:0;z-index:10;background:rgba(252,255,253,.94);border-bottom:1px solid #cfe9d9;padding:9px 12px;box-shadow:0 4px 16px rgba(69,126,98,.10);backdrop-filter:blur(10px)}
.bar{max-width:1440px;margin:auto;display:flex;align-items:center;gap:12px}
.title{font-weight:950;font-size:17px;white-space:nowrap;color:#22694f;letter-spacing:-.4px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));justify-content:start;gap:7px;flex:1;min-width:0}
.tabs button{
  --tab:#35c98c;--tab2:#54cbd6;--wash:#f3fcf7;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:0;
  min-width:0;min-height:46px;padding:6px 9px;
  border:1px solid color-mix(in srgb,var(--tab) 35%,#dbeae2);
  border-radius:14px;background:linear-gradient(180deg,#fff,var(--wash));
  color:#4d6c60;font-weight:900;cursor:pointer;
  box-shadow:0 2px 8px rgba(58,108,85,.07);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
}
.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:99px 99px 0 0;background:linear-gradient(90deg,var(--tab),var(--tab2));opacity:.42}
.tabs button:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(58,108,85,.11)}
.tabs button.active{
  color:#47665a;
  border:1px solid color-mix(in srgb,var(--tab) 42%,#dbeae2);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--tab) 7%,#ffffff),
    color-mix(in srgb,var(--tab2) 5%,#ffffff));
  box-shadow:
    0 3px 9px rgba(58,108,85,.09),
    inset 0 0 0 1px rgba(255,255,255,.72);
}
.tabs button.active::after{
  opacity:.8;
  height:3px;
  left:12px;
  right:12px;
}
#tabEngrave{--tab:#2fbe86;--tab2:#4fc9c4;--wash:#effbf5}
#tabRecycle{--tab:#35a4a0;--tab2:#65cdb5;--wash:#f0fffb}
#tabCraft{--tab:#d99b35;--tab2:#efbf54;--wash:#fff9e7}
#tabStone{--tab:#459bcf;--tab2:#64c4df;--wash:#eff9fe}
#tabCore{--tab:#ca8f47;--tab2:#dfb86b;--wash:#fff8ed}
#tabAwakening{--tab:#8b5bb9;--tab2:#ba91db;--wash:#f8f3ff}
#tabTower{--tab:#7b78cf;--tab2:#a092e6;--wash:#f5f3ff}
#tabTraining{--tab:#e18755;--tab2:#e8b15f;--wash:#fff7ef}
#tabPenetration{--tab:#1b9e83;--tab2:#79d6a6;--wash:#f1fff9}
.tab-label{min-width:0;max-width:100%;line-height:1.3;white-space:normal;overflow-wrap:anywhere;text-align:center}
.short{display:none}
.mobile-menu-toggle{display:none}
main{flex:1;min-height:0}
iframe{width:100%;height:100%;border:0;display:none;background:white}
iframe.active{display:block}
/* PC: 메뉴명은 한 줄로, 화면이 좁아지면 3열로 전환 */
@media(min-width:601px) and (max-width:1250px){
 .title{display:none}
 .tabs{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(min-width:601px) and (max-width:930px){
 .tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;justify-content:stretch}
 .tabs button{min-height:42px}
}
@media(max-width:600px){
header{padding:6px 7px 7px}
.bar{display:block}
.title{display:none}
.mobile-menu-toggle{
 display:flex;align-items:center;gap:9px;width:100%;min-height:45px;
 border:1px solid #b7deca;border-radius:12px;padding:8px 12px;
 background:linear-gradient(135deg,#f5fff8,#eaf8f0);color:#22694f;
 box-shadow:0 2px 7px rgba(58,108,85,.07);cursor:pointer;text-align:left;
 font:inherit;-webkit-tap-highlight-color:transparent;
}
.mobile-menu-toggle:focus-visible{outline:3px solid #3ca77d;outline-offset:2px}
.mobile-menu-icon{font-size:19px;color:#269a71;line-height:1;flex:none}
.mobile-menu-current{min-width:0;flex:1;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobile-menu-hint{font-size:11px;font-weight:750;color:#497a67;flex:none;white-space:nowrap}
.mobile-menu-chevron{font-size:18px;line-height:1;color:#19875e;transition:transform .18s;flex:none}
header.menu-open .mobile-menu-chevron{transform:rotate(180deg)}
.tabs{
  display:none;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  width:100%;
}
header.menu-open .tabs{
  display:grid;
  margin-top:7px;
  max-height:min(55vh,360px);
  max-height:min(55dvh,360px);
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:2px 1px 5px;
}
.tabs button{
  min-width:0;
  min-height:50px;
  padding:7px 4px;
  border-radius:12px;
  gap:0;
  font-size:12px;
  line-height:1.25;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:keep-all;
  text-align:center;
  box-shadow:0 2px 7px rgba(58,108,85,.06);
}
.tabs button::after{left:9px;right:9px;height:2px}
.tabs button{grid-column:auto}
.tabs button.active{box-shadow:0 3px 8px rgba(58,108,85,.08),inset 0 0 0 1px rgba(255,255,255,.72)}
.full{display:inline}
.short{display:none}
}

@media(max-width:360px){
.tabs{gap:4px}
.tabs button{min-height:50px;padding:6px 3px;font-size:12px;gap:0}
}
</style>
<link rel="stylesheet" href="./clarity-ui.css?v=2">
</head>
<body>
<header id="calculatorHeader"><div class="bar"><div class="title"><span class="brand-copy">궁수키우기<small>통합계산기 · v0.2.6</small></span></div>
<button id="mobileMenuToggle" class="mobile-menu-toggle" type="button" aria-controls="calculatorTabs" aria-expanded="false" aria-label="각인석 계산기 · 메뉴 펼치기">
<span class="mobile-menu-icon" aria-hidden="true">☰</span><span id="mobileMenuCurrent" class="mobile-menu-current">각인석 계산기</span>
<span id="mobileMenuHint" class="mobile-menu-hint">메뉴 펼치기</span><span class="mobile-menu-chevron" aria-hidden="true">⌄</span>
</button>
<div class="tabs" id="calculatorTabs">
<button id="tabEngrave" class="active" type="button"><span class="tab-label"><span class="full">각인석 계산기</span><span class="short">각인석</span></span></button>
<button id="tabStone" type="button"><span class="tab-label"><span class="full">초월의 탑</span><span class="short">초월의 탑</span></span></button>
<button id="tabCore" type="button"><span class="tab-label"><span class="full">초월핵</span><span class="short">초월핵</span></span></button>
<button id="tabAwakening" type="button"><span class="tab-label"><span class="full">각성석</span><span class="short">각성석</span></span></button>
<button id="tabPenetration" type="button"><span class="tab-label"><span class="full">관통 Total</span><span class="short">관통 Total</span></span></button>
</div></div></header>
<main>
<iframe id="engrave" class="active" src="index.html" title="각인석 계산기"></iframe>
<iframe id="stone" src="transcend.html" title="초월석 시뮬레이터"></iframe>
<iframe id="core" src="core.html?v=100fix1" title="천명의 핵 100단계 초월 및 20조각 제작 계산기"></iframe>
<iframe id="awakening" src="awakening.html" title="각성석 최적 배분 시뮬레이터"></iframe>
<iframe id="penetration" src="penetration.html" title="관통 Total"></iframe>
</main>
<script>
const tabs=[
 ["engrave","tabEngrave"],
 ["stone","tabStone"],["core","tabCore"],["awakening","tabAwakening"],["penetration","tabPenetration"],
];
const LAST_TAB_KEY="archer:calculator:last-tab:v1";
const frames=Object.fromEntries(tabs.map(([id])=>[id,document.getElementById(id)]));
const buttons=Object.fromEntries(tabs.map(([id,button])=>[id,document.getElementById(button)]));
const calculatorHeader=document.getElementById("calculatorHeader");
const mobileMenuToggle=document.getElementById("mobileMenuToggle");
const mobileMenuCurrent=document.getElementById("mobileMenuCurrent");
const mobileMenuHint=document.getElementById("mobileMenuHint");
function setMobileMenuExpanded(open){
 const expanded=Boolean(open);
 calculatorHeader.classList.toggle("menu-open",expanded);
 mobileMenuToggle.setAttribute("aria-expanded",String(expanded));
 mobileMenuHint.textContent=expanded?"메뉴 접기":"메뉴 펼치기";
 mobileMenuToggle.setAttribute("aria-label",mobileMenuCurrent.textContent+" · "+mobileMenuHint.textContent);
}
mobileMenuToggle.addEventListener("click",()=>{
 setMobileMenuExpanded(!calculatorHeader.classList.contains("menu-open"));
});
window.addEventListener("resize",()=>{
 if(window.innerWidth>600&&calculatorHeader.classList.contains("menu-open"))setMobileMenuExpanded(false);
});
let pendingTowerPen=null;
function handoffToTower(value){
 if(!Number.isSafeInteger(value)||value<0)return;
 pendingTowerPen=value;
 try{localStorage.setItem("archer:tower:handoff",String(value));}catch(_){}
 if(frames.stone.contentWindow){
   frames.stone.contentWindow.postMessage({type:"archer:set-tower-penetration",penetration:value},location.origin);
 }
}
function show(which){
 if(!frames[which])return;
 for(const [id] of tabs){
   frames[id].classList.toggle("active",id===which);
   buttons[id].classList.toggle("active",id===which);
   buttons[id].setAttribute("aria-pressed",String(id===which));
 }
 mobileMenuCurrent.textContent=buttons[which].querySelector(".full").textContent.trim();
 setMobileMenuExpanded(false);
 if(history.replaceState)history.replaceState(null,"","#"+which);
  try{localStorage.setItem(LAST_TAB_KEY,which)}catch(_){}
 if(which==="stone"&&pendingTowerPen!==null)handoffToTower(pendingTowerPen);
}
for(const [id] of tabs)buttons[id].onclick=()=>show(id);
frames.stone.addEventListener("load",()=>{
 if(pendingTowerPen!==null)handoffToTower(pendingTowerPen);
});
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||event.source!==frames.penetration.contentWindow)return;
 if(!event.data||event.data.type!=="archer:penetration-total")return;
 const value=event.data.penetration;
 if(!Number.isSafeInteger(value)||value<0)return;
 handoffToTower(value);
 show("stone");
});
const init=decodeURIComponent((location.hash||"").replace(/^#/,""));
const standaloneRoutes={training:"training.html",craft:"crafttime.html",crafttime:"crafttime.html",recycle:"engrave-recycle.html"};
if(Object.prototype.hasOwnProperty.call(standaloneRoutes,init))location.replace(standaloneRoutes[init]);
else if(init==="tower")show("stone");
else if(frames[init])show(init);
else {
  try{const last=localStorage.getItem(LAST_TAB_KEY);if(last&&frames[last])show(last)}catch(_){}
}
</script>
<!-- development integration: core calculator added without deploying -->
</body></html>
