<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>초월의 탑 관통·명중 계산기</title>
<style>
:root{--bg:#f4fff8;--card:#fff;--line:#cfe9d9;--text:#29463b;--muted:#71867c;--accent:#35c98c;--strong:#198b64}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4fff8,#fff9ea);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
main{width:min(760px,100%);margin:auto;padding:22px 14px 50px}
h1{font-size:24px;margin:0 0 6px}.sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 22px rgba(69,126,98,.09);margin-bottom:14px}
label{font-size:13px;font-weight:800}input{width:100%;margin-top:6px;border:1px solid #b9ddc8;border-radius:12px;padding:13px;font-size:18px;font-weight:800;color:var(--text);background:#fbfffc;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(53,201,140,.12)}input[aria-invalid="true"]{border-color:#c95b5b}
.floorLookup{margin-top:12px;padding-top:12px;border-top:1px solid #e1efe7;display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:end}.lookupResult{min-height:50px;border-radius:12px;background:#effbf4;padding:13px 14px;font-size:14px;font-weight:850;display:flex;align-items:center;color:var(--strong)}

details{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}summary{cursor:pointer;padding:15px 16px;font-weight:900;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"＋";float:right;color:var(--strong)}details[open] summary:after{content:"－"}
.tableWrap{max-height:62vh;overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid #e4f1e9;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:center}thead th{position:sticky;top:0;background:#effbf4;z-index:1}tr.hit{background:#e8fff2;font-weight:900;outline:2px solid var(--accent);outline-offset:-2px}
.note{font-size:12px;color:var(--muted);margin:10px 3px 0;line-height:1.5}
@media(max-width:520px){main{padding:16px 10px 40px}.floorLookup{grid-template-columns:1fr}.lookupResult{min-height:44px}h1{font-size:21px}.card{padding:13px}input{font-size:16px;padding:11px}th,td{padding:8px 5px;font-size:13px}}
</style>
</head>
<body><main>
<h1>초월의 탑</h1>
<div class="sub">500~3000층 관통/명중 필요 수치 조회</div>
<section class="card" id="lookupCard"><h2 style="font-size:17px;margin:0 0 10px">층별 필요 수치 조회</h2><div class="floorLookup" style="margin-top:0;padding-top:0;border-top:0"><label>층수<input id="lookupFloor" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="go" value="1234" placeholder="예: 1234, 1313, 2999"></label><div id="lookupResult" class="lookupResult">1234층 · 필요 관통 8,508 / 필요 명중 23,686</div></div></section>

<details id="list">
<summary>500층부터 필요 관통·명중 수치 보기</summary>
<div class="tableWrap"><table><thead><tr><th>층</th><th>필요 관통</th><th>필요 명중</th></tr></thead><tbody id="rows"></tbody></table></div>
</details>
<div class="note">필요 관통은 보스 Block, 필요 명중은 보스 Evasion 값으로 계산. 공격력·생존·제한시간은 제외한 관통/명중 조건만 판정한다.</div>
</main>
<script>
const fmt=n=>Math.trunc(n).toLocaleString('ko-KR');
// APK 0.1.87 TranscendenceTower1000/1500/3000Balance 원본 배열·보간식.
const B1=[2500,3000,3600,4300,5100,6000], E1=[8000,9500,11200,13100,15200,17500];
const B2=[6000,7000,8100,9300,10600,12000], E2=[17500,20000,22700,25600,28700,32000];
const B3=[12000,18000,25000,33000], E3=[32000,48000,66000,86000];
function tower1000Value(f,vals){
 const level=Math.max(501,Math.min(1000,f));
 const i=Math.floor((level-501)/100),t=level-i*100-500;
 return vals[i]+Math.trunc(((vals[i+1]-vals[i])*t+50)/100);
}
function tower1500Value(f,vals){
 const level=Math.max(1001,Math.min(1500,f));
 const i=Math.floor((level-1001)/100),t=level-i*100-1000;
 return vals[i]+Math.trunc((vals[i+1]-vals[i])/100)*t;
}
function tower3000Value(f,vals){
 const level=Math.max(1501,Math.min(3000,f));
 const i=Math.floor((level-1501)/500);
 const t=level-i*500-1500;
 return vals[i]+Math.trunc((vals[i+1]-vals[i])/500)*t;
}
function req(f){
 if(f<=1000)return [tower1000Value(f,B1),tower1000Value(f,E1)];
 if(f<=1500)return [tower1500Value(f,B2),tower1500Value(f,E2)];
 return [tower3000Value(f,B3),tower3000Value(f,E3)];
}
const lookupFloor=document.getElementById('lookupFloor'),lookupResult=document.getElementById('lookupResult');
function floorNum(v){
 const t=String(v).trim();
 if(!/^\\d+$/.test(t))return NaN;
 const n=Number(t);
 return Number.isSafeInteger(n)?n:NaN;
}
function updateLookup(){
 const f=floorNum(lookupFloor.value);
 const ok=Number.isFinite(f)&&f>=500&&f<=3000;
 lookupFloor.setAttribute('aria-invalid',ok?'false':'true');
 document.querySelectorAll('tr.hit').forEach(r=>r.classList.remove('hit'));
 if(!ok){lookupResult.textContent='500~3000 사이의 정수 층수를 입력해 주세요.';return}
 const [p,a]=req(f);
 lookupResult.textContent=f+'층 · 필요 관통 '+fmt(p)+' / 필요 명중 '+fmt(a);
 const row=document.getElementById('f'+f);if(row)row.classList.add('hit');
}
const list=document.getElementById('list'),rows=document.getElementById('rows');
let rowsBuilt=false;
function buildRows(){
 if(rowsBuilt)return;
 const frag=document.createDocumentFragment();
 for(let f=500;f<=3000;f++){
  const [p,a]=req(f),tr=document.createElement('tr');
  tr.id='f'+f;tr.innerHTML='<td>'+f+'</td><td>'+fmt(p)+'</td><td>'+fmt(a)+'</td>';frag.appendChild(tr);
 }
 rows.appendChild(frag);rowsBuilt=true;updateLookup();
}
lookupFloor.addEventListener('input',updateLookup);
lookupFloor.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 e.preventDefault();
 updateLookup();
 const f=floorNum(lookupFloor.value);
 if(!Number.isFinite(f)||f<500||f>3000)return;
 list.open=true;buildRows();
 const row=document.getElementById('f'+f);
 if(row)row.scrollIntoView({behavior:'smooth',block:'center'});
});
list.addEventListener('toggle',()=>{if(list.open)buildRows()});
updateLookup();
</script></body></html>
