<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>궁수키우기 IL2CPP v31 분석 도구</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--panel:#171b24;--line:#344055;--text:#f2f4f8;--muted:#aab3c5;--good:#91e6a7;--bad:#ff8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:980px;margin:auto;padding:18px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;margin:12px 0}
h1{font-size:21px;margin:0 0 8px}h2{font-size:16px;margin:0 0 10px}p{color:var(--muted);font-size:13px;line-height:1.55}
label{display:block;margin:10px 0 5px;color:var(--muted);font-size:13px}input,button{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0f1320;color:var(--text);font:inherit}
button{cursor:pointer;font-weight:700;background:#20354a;margin-top:10px}button:disabled{opacity:.5;cursor:not-allowed}
pre{white-space:pre-wrap;word-break:break-word;background:#0c0f15;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:12px;line-height:1.5;max-height:620px;overflow:auto}
.ok{color:var(--good)}.bad{color:var(--bad)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a{color:#8ccfff}@media(max-width:700px){.row{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>
<body>
<main>
<h1>IL2CPP v31 초월 함수 분석 도구 <small style="font-size:12px;color:#91e6a7">build 17</small></h1>
<p>파일은 브라우저 안에서만 읽습니다. 서버 업로드는 하지 않습니다. metadata v31 구조와 ARM64 ELF64를 기준으로 대상 함수의 method index/token, 모듈, 실제 함수 VA와 코드 바이트를 찾습니다.</p>

<section class="panel">
<div class="row">
<div><label>global-metadata.dat</label><input id="meta" type="file"></div>
<div><label>libil2cpp.so</label><input id="lib" type="file"></div>
</div>
<button id="run" type="button">분석 실행</button>
<p id="status">두 파일을 선택하세요.</p>
</section>

<section class="panel">
<h2>분석 결과</h2>
<pre id="out">아직 실행 전.</pre>
<a id="download" hidden download="archer_il2cpp_probe_report.txt">분석 보고서 TXT 저장</a>
</section>
</main>

<script>
(() => {
  const TARGETS = [
    "CalculateGoldTranscendMultiplierAtLevel",
    "GetTotalGoldTranscendenceAttackMultiplier",
    "GetGoldTranscendCostForTargetLevel",
    "GetGoldTranscendTotalCost",
    "GetTranscendenceCurrentEffectAtLevel"
  ];
  const $ = id => document.getElementById(id);
  const hex = (n, w=0) => {
    const s = (typeof n === "bigint" ? n : BigInt(n >>> 0)).toString(16).toUpperCase();
    return "0x" + s.padStart(w, "0");
  };
  const u16=(v,o)=>v.getUint16(o,true), u32=(v,o)=>v.getUint32(o,true), i32=(v,o)=>v.getInt32(o,true), u64=(v,o)=>v.getBigUint64(o,true);
  function cstr(bytes, off, max=4096){
    if(off < 0 || off >= bytes.length) return "";
    let e=off, lim=Math.min(bytes.length,off+max);
    while(e<lim && bytes[e]!==0)e++;
    return new TextDecoder().decode(bytes.subarray(off,e));
  }
  function findAscii(bytes,start,size,text){
    const pat = new TextEncoder().encode(text);
    const end = Math.min(bytes.length,start+size);
    const out=[];
    outer: for(let i=start;i+pat.length<end;i++){
      if(bytes[i]!==pat[0]) continue;
      for(let j=1;j<pat.length;j++) if(bytes[i+j]!==pat[j]) continue outer;
      if(i+pat.length<end && bytes[i+pat.length]===0) out.push(i-start);
    }
    return out;
  }
  function parseMetadata(buf){
    const v=new DataView(buf), b=new Uint8Array(buf);
    const sanity=u32(v,0), version=i32(v,4);
    if(sanity!==0xFAB11BAF) throw new Error("global-metadata.dat sanity 불일치");
    if(version!==31) throw new Error("현재 분석기는 metadata v31 전용입니다. 감지 버전: "+version);

    const stringOffset=u32(v,24), stringSize=i32(v,28);
    const methodsOffset=u32(v,48), methodsSize=i32(v,52);
    const fieldDefaultsOffset=u32(v,64), fieldDefaultsSize=i32(v,68);
    const defaultDataOffset=u32(v,72), defaultDataSize=i32(v,76);
    const parametersOffset=u32(v,88), parametersSize=i32(v,92);
    const fieldsOffset=u32(v,96), fieldsSize=i32(v,100);
    const typeDefsOffset=u32(v,160), typeDefsSize=i32(v,164);
    const imagesOffset=u32(v,168), imagesSize=i32(v,172);
    const fieldRefsOffset=u32(v,184), fieldRefsSize=i32(v,188);
    const METHOD_SIZE=36, PARAM_SIZE=12, FIELD_SIZE=12, FIELD_DEFAULT_SIZE=12, FIELD_REF_SIZE=8, TYPE_SIZE=88, IMAGE_SIZE=40;
    if(methodsSize%METHOD_SIZE) throw new Error("v31 method struct 크기(36)와 methodsSize가 맞지 않음");
    if(typeDefsSize%TYPE_SIZE) throw new Error("v31 type struct 크기(88)와 typeDefinitionsSize가 맞지 않음");
    if(imagesSize%IMAGE_SIZE) throw new Error("v31 image struct 크기(40)와 imagesSize가 맞지 않음");

    const methodCount=methodsSize/METHOD_SIZE, typeCount=typeDefsSize/TYPE_SIZE, imageCount=imagesSize/IMAGE_SIZE;
    const parameterCount=parametersSize/PARAM_SIZE;
    const fieldCount=fieldsSize/FIELD_SIZE, fieldDefaultCount=fieldDefaultsSize/FIELD_DEFAULT_SIZE;
    const fieldRefCount=fieldRefsSize/FIELD_REF_SIZE;
    const parameters=[];
    for(let i=0;i<parameterCount;i++){
      const o=parametersOffset+i*PARAM_SIZE;
      const nameIndex=u32(v,o), token=u32(v,o+4), typeIndex=i32(v,o+8);
      parameters.push({index:i,nameIndex,name:cstr(b,stringOffset+nameIndex),token,typeIndex});
    }
    const fields=[];
    for(let i=0;i<fieldCount;i++){
      const o=fieldsOffset+i*FIELD_SIZE;
      const nameIndex=u32(v,o), typeIndex=i32(v,o+4), token=u32(v,o+8);
      fields.push({index:i,nameIndex,name:cstr(b,stringOffset+nameIndex),typeIndex,token});
    }
    const fieldDefaults=new Map();
    for(let i=0;i<fieldDefaultCount;i++){
      const o=fieldDefaultsOffset+i*FIELD_DEFAULT_SIZE;
      const fieldIndex=i32(v,o), typeIndex=i32(v,o+4), dataIndex=i32(v,o+8);
      fieldDefaults.set(fieldIndex,{fieldIndex,typeIndex,dataIndex});
    }
    const fieldRefs=[];
    for(let i=0;i<fieldRefCount;i++){
      const o=fieldRefsOffset+i*FIELD_REF_SIZE;
      fieldRefs.push({index:i,typeIndex:i32(v,o),fieldIndex:i32(v,o+4)});
    }

    const targetNameIndices=new Map();
    for(const t of TARGETS){
      const hits=findAscii(b,stringOffset,stringSize,t);
      targetNameIndices.set(t,new Set(hits));
    }

    const methods=[];
    const allMethods=[];
    for(let i=0;i<methodCount;i++){
      const o=methodsOffset+i*METHOD_SIZE, nameIndex=u32(v,o);
      const declaringType=i32(v,o+4);
      const returnTypeIndex=i32(v,o+8);
      const parameterStart=i32(v,o+16);
      const token=u32(v,o+24);
      const flags=u16(v,o+28), parameterCount2=u16(v,o+34);
      const name=cstr(b,stringOffset+nameIndex);
      allMethods.push({name,defIndex:i,nameIndex,declaringType,returnTypeIndex,parameterStart,parameterCount:parameterCount2,flags,token,pointerIndex:(token&0x00FFFFFF)-1});
      for(const t of TARGETS){
        if(!targetNameIndices.get(t).has(nameIndex)) continue;
        methods.push({target:t,defIndex:i,nameIndex,declaringType,returnTypeIndex,parameterStart,parameterCount:parameterCount2,flags,token});
      }
    }

    function typeInfo(idx){
      if(idx<0||idx>=typeCount) return {index:idx,name:"?",namespace:"?",firstFieldIdx:-1,fieldCount:0,token:0};
      const o=typeDefsOffset+idx*TYPE_SIZE;
      const ni=u32(v,o), nsi=u32(v,o+4);
      return {
        index:idx,
        name:cstr(b,stringOffset+ni),
        namespace:cstr(b,stringOffset+nsi),
        firstFieldIdx:i32(v,o+32),
        fieldCount:u16(v,o+68),
        token:u32(v,o+84)
      };
    }
    const typeDefs=Array.from({length:typeCount},(_,i)=>typeInfo(i));
    const images=[];
    for(let i=0;i<imageCount;i++){
      const o=imagesOffset+i*IMAGE_SIZE;
      const ni=u32(v,o), typeStart=i32(v,o+8), typeCount2=u32(v,o+12);
      images.push({index:i,name:cstr(b,stringOffset+ni),typeStart,typeCount:typeCount2});
    }
    function imageForType(ti){
      return images.find(x=>ti>=x.typeStart && ti<x.typeStart+x.typeCount) || null;
    }
    for(const m of methods){
      m.type=typeInfo(m.declaringType);
      m.image=imageForType(m.declaringType);
      m.pointerIndex=(m.token & 0x00FFFFFF)-1;
    }
    for(const m of allMethods){
      m.type=typeInfo(m.declaringType);
      m.image=imageForType(m.declaringType);
    }
    return {version,methodCount,typeCount,imageCount,methods,allMethods,images,parameters,fields,fieldDefaults,fieldRefs,typeDefs,defaultDataOffset,defaultDataSize,rawView:v,rawBytes:b};
  }

  function parseElf(buf){
    const v=new DataView(buf), b=new Uint8Array(buf);
    if(b[0]!==0x7f||b[1]!==0x45||b[2]!==0x4c||b[3]!==0x46) throw new Error("libil2cpp.so가 ELF 파일이 아님");
    if(b[4]!==2) throw new Error("ELF64가 아님");
    if(b[5]!==1) throw new Error("little-endian ELF가 아님");
    const machine=u16(v,18);
    if(machine!==183) throw new Error("ARM64(AArch64) ELF가 아님. e_machine="+machine);
    const phoff=Number(u64(v,32)), phentsize=u16(v,54), phnum=u16(v,56);
    const segs=[]; let dynamicPh=null;
    for(let i=0;i<phnum;i++){
      const o=phoff+i*phentsize;
      const p_type=u32(v,o), flags=u32(v,o+4), offset=Number(u64(v,o+8)), va=u64(v,o+16),
            filesz=Number(u64(v,o+32)), memsz=Number(u64(v,o+40));
      const ph={p_type,flags,offset,va,filesz,memsz};
      if(p_type===1 && memsz>0) segs.push(ph);
      if(p_type===2) dynamicPh=ph;
    }
    const exec=segs.filter(s=>[1,3,5,7].includes(s.flags));
    const data=segs.filter(s=>[2,4,6].includes(s.flags));
    function vaToOff(va){
      for(const s of segs){
        const end=s.va+BigInt(s.memsz);
        if(va>=s.va && va<end){
          const delta=va-s.va;
          const off=BigInt(s.offset)+delta;
          if(off<0n || off>=BigInt(buf.byteLength)) throw new Error("VA가 파일 범위를 벗어남: "+hex(va));
          return Number(off);
        }
      }
      throw new Error("VA 매핑 실패: "+hex(va));
    }
    function inExec(va){ return exec.some(s=>va>=s.va && va<s.va+BigInt(s.memsz)); }

    // Android/ARM64 ELF는 .data.rel.ro 포인터가 relocation 적용 전에는 0 또는 미해결 상태일 수 있다.
    let relocationApplied=0, relocationSeen=0;
    if(dynamicPh){
      const dyn=new Map();
      for(let p=dynamicPh.offset;p+16<=dynamicPh.offset+dynamicPh.filesz;p+=16){
        const tag=v.getBigInt64(p,true), val=u64(v,p+8);
        if(tag===0n) break;
        if(!dyn.has(tag.toString())) dyn.set(tag.toString(),val);
      }
      const relaVA=dyn.get("7"), relaSize=dyn.get("8"), symtabVA=dyn.get("6");
      if(relaVA!==undefined && relaSize!==undefined){
        try{
          const relaOff=vaToOff(relaVA), count=Number(relaSize/24n);
          const symtabOff=symtabVA!==undefined?vaToOff(symtabVA):0;
          for(let i=0;i<count;i++){
            const o=relaOff+i*24;
            if(o+24>buf.byteLength) break;
            const rOffset=u64(v,o), rInfo=u64(v,o+8), addend=v.getBigInt64(o+16,true);
            const type=Number(rInfo & 0xffffffffn), sym=Number(rInfo>>32n);
            relocationSeen++;
            let value=null;
            if(type===1027){ // R_AARCH64_RELATIVE
              value=BigInt.asUintN(64,addend);
            }else if(type===257 && symtabVA!==undefined){ // R_AARCH64_ABS64
              const so=symtabOff+sym*24;
              if(so+24<=buf.byteLength){
                const stValue=u64(v,so+8);
                value=BigInt.asUintN(64,stValue+addend);
              }
            }
            if(value!==null){
              try{
                const dst=vaToOff(rOffset);
                if(dst+8<=buf.byteLength){
                  v.setBigUint64(dst,value,true);
                  relocationApplied++;
                }
              }catch(e){}
            }
          }
        }catch(e){}
      }
    }

    function readPtrVA(va){ return u64(v,vaToOff(va)); }
    function readStrVA(va,max=1024){ return cstr(b,vaToOff(va),max); }
    function refs(addr){
      const out=[];
      for(const s of data){
        const end=Math.min(s.offset+s.filesz,buf.byteLength)-8;
        for(let p=s.offset;p<=end;p+=8){
          if(u64(v,p)===addr) out.push(s.va+BigInt(p-s.offset));
        }
      }
      return out;
    }
    function byteHits(sec,pat){
      const out=[], start=sec.offset, end=Math.min(buf.byteLength,sec.offset+sec.filesz);
      outer: for(let i=start;i+pat.length<=end;i++){
        if(b[i]!==pat[0])continue;
        for(let j=1;j<pat.length;j++)if(b[i+j]!==pat[j])continue outer;
        out.push(sec.va+BigInt(i-start));
      }
      return out;
    }
    return {buf,v,b,segs,exec,data,vaToOff,inExec,readPtrVA,readStrVA,refs,byteHits,relocationApplied,relocationSeen};
  }

  function findCodeGenModuleDirect(elf,name,requiredIndices,log){
    const pat=new TextEncoder().encode(name+"\0");
    const hits=[];
    for(const sec of elf.segs) hits.push(...elf.byteHits(sec,pat));
    log.push(name+" 문자열 후보: "+hits.length+"개");
    const maxIdx=Math.max(...requiredIndices,0);
    for(const nameVA of hits){
      const rr=elf.refs(nameVA);
      for(const candidate of rr){
        try{
          if(elf.readPtrVA(candidate)!==nameVA) continue;
          const count=Number(elf.readPtrVA(candidate+8n));
          const ptrs=elf.readPtrVA(candidate+16n);
          if(!Number.isFinite(count)||count<=maxIdx||count>1000000) continue;
          elf.vaToOff(ptrs);
          let good=0;
          for(const idx of requiredIndices){
            const fn=elf.readPtrVA(ptrs+BigInt(idx*8));
            if(fn!==0n && elf.inExec(fn)) good++;
          }
          if(good===requiredIndices.length){
            log.push("CodeGenModule 직접 탐색 성공: "+name+" @ "+hex(candidate)+" / methods="+count);
            return {name,p:candidate,methodPointerCount:count,methodPointers:ptrs};
          }
        }catch(e){}
      }
    }
    return null;
  }

  function findCodeRegistration(elf,imageCount,log){
    const pat=new TextEncoder().encode("mscorlib.dll\0");
    const secSets=[elf.exec,elf.data];
    for(const secs of secSets){
      for(const sec of secs){
        const hits=elf.byteHits(sec,pat);
        for(const dllva of hits){
          const r1=elf.refs(dllva);
          for(const refva of r1){
            const r2=elf.refs(refva);
            for(const refva2 of r2){
              for(let i=imageCount-1;i>=0;i--){
                const base=refva2-BigInt(i*8);
                const r3=elf.refs(base);
                for(const refva3 of r3){
                  try{
                    const count=elf.readPtrVA(refva3-8n);
                    if(count===BigInt(imageCount)){
                      const cr=refva3-112n;
                      try{
                        const cgCount=elf.readPtrVA(cr+104n);
                        const cgPtr=elf.readPtrVA(cr+112n);
                        elf.vaToOff(cgPtr);
                        if(cgCount>0n && cgCount<10000n){
                          log.push("CodeRegistration(v31) 후보: "+hex(cr)+" / codeGenModules="+cgCount);
                          return {va:cr,version:31,count:Number(cgCount),modulesPtr:cgPtr};
                        }
                      }catch(e){}
                    }
                  }catch(e){}
                }
              }
            }
          }
        }
      }
    }
    throw new Error("CodeRegistration 자동 탐색 실패");
  }

  function resolveFunctions(meta,elf,cr,log){
    let modules=[];
    if(cr){
      for(let i=0;i<cr.count;i++){
        const p=elf.readPtrVA(cr.modulesPtr+BigInt(i*8));
        if(p===0n) continue;
        try{
          const namePtr=elf.readPtrVA(p);
          const name=elf.readStrVA(namePtr);
          const methodPointerCount=Number(elf.readPtrVA(p+8n));
          const methodPointers=elf.readPtrVA(p+16n);
          modules.push({i,p,name,methodPointerCount,methodPointers});
        }catch(e){}
      }
      log.push("CodeRegistration에서 읽은 CodeGenModule: "+modules.length+"개");
    }

    const byImage=new Map();
    for(const m of meta.methods){
      const name=m.image?.name||"";
      if(!byImage.has(name)) byImage.set(name,[]);
      byImage.get(name).push(m.pointerIndex);
    }
    for(const [name,indices] of byImage){
      if(!modules.some(x=>x.name===name)){
        const direct=findCodeGenModuleDirect(elf,name,indices,log);
        if(direct) modules.push(direct);
      }
    }

    for(const m of meta.methods){
      const want=m.image?.name || "";
      const mod=modules.find(x=>x.name===want) || modules.find(x=>x.name.toLowerCase()===want.toLowerCase());
      if(!mod){
        m.resolveError="CodeGenModule 미발견: "+want;
        continue;
      }
      m.module=mod.name;
      if(m.pointerIndex<0 || m.pointerIndex>=mod.methodPointerCount){
        m.resolveError="token pointer index 범위 초과: "+m.pointerIndex+" / "+mod.methodPointerCount;
        continue;
      }
      const ptr=elf.readPtrVA(mod.methodPointers+BigInt(m.pointerIndex*8));
      m.functionVA=ptr;
      try{m.functionFileOffset=elf.vaToOff(ptr)}catch(e){m.resolveError="함수 VA 매핑 실패";continue}
      let next=0n;
      const maxScan=Math.min(mod.methodPointerCount,m.pointerIndex+256);
      for(let j=m.pointerIndex+1;j<maxScan;j++){
        const q=elf.readPtrVA(mod.methodPointers+BigInt(j*8));
        if(q>ptr && (next===0n || q<next)) next=q;
      }
      let size=1024;
      if(next>ptr){
        const d=Number(next-ptr);
        if(d>0 && d<=4096) size=d;
      }
      size=Math.min(size,4096,elf.buf.byteLength-m.functionFileOffset);
      const code=elf.b.subarray(m.functionFileOffset,m.functionFileOffset+size);
      const lines=[];
      for(let i=0;i<code.length;i+=16){
        const chunk=Array.from(code.subarray(i,i+16)).map(x=>x.toString(16).padStart(2,"0")).join(" ");
        lines.push((m.functionFileOffset+i).toString(16).padStart(8,"0")+": "+chunk);
      }
      m.codeSize=size;
      m.codeBytes=code;
      m.hexDump=lines.join("\n");
    }
    return modules;
  }

  function decodeDirectCalls(method){
    const out=[];
    if(!method.functionVA || !method.codeBytes) return out;
    const dv=new DataView(method.codeBytes.buffer,method.codeBytes.byteOffset,method.codeBytes.byteLength);
    for(let off=0;off+4<=method.codeBytes.length;off+=4){
      const ins=dv.getUint32(off,true);
      if((((ins & 0xFC000000) >>> 0)) !== 0x94000000) continue;
      let imm=ins & 0x03FFFFFF;
      if(imm & 0x02000000) imm-=0x04000000;
      const at=method.functionVA+BigInt(off);
      const target=BigInt.asUintN(64,at+BigInt(imm*4));
      out.push({at,target});
    }
    return out;
  }

  function annotateInternalCalls(meta,elf,modules,log){
    const modByName=new Map(modules.map(m=>[m.name,m]));
    const vaNames=new Map();
    const vaMeta=new Map();
    for(const am of meta.allMethods){
      const img=am.image?.name||"";
      const mod=modByName.get(img);
      if(!mod || am.pointerIndex<0 || am.pointerIndex>=mod.methodPointerCount) continue;
      try{
        const va=elf.readPtrVA(mod.methodPointers+BigInt(am.pointerIndex*8));
        if(!vaNames.has(va.toString())){
          const full=(am.type?.name?am.type.name+".":"")+am.name;
          vaNames.set(va.toString(),full);
          vaMeta.set(va.toString(),{...am,va,mod});
        }
      }catch(e){}
    }
    const helpers=new Map();
    log.push("");
    log.push("[대상 함수 내부 직접 호출 매핑]");
    for(const m of meta.methods){
      log.push(m.target);
      for(const c of decodeDirectCalls(m)){
        const n=vaNames.get(c.target.toString());
        if(n){
          log.push("  "+hex(c.at)+" -> "+hex(c.target)+"  "+n);
          if(!TARGETS.includes(n.split(".").pop())) helpers.set(c.target.toString(),vaMeta.get(c.target.toString()));
        }
      }
    }
    if(helpers.size){
      log.push("");
      log.push("[Assembly-CSharp 내부 helper 코드]");
      for(const h of helpers.values()){
        try{
          const mod=h.mod, ptr=h.va;
          const allPtrs=[];
          for(let i=0;i<mod.methodPointerCount;i++){
            const q=elf.readPtrVA(mod.methodPointers+BigInt(i*8));
            if(q>0n) allPtrs.push(q);
          }
          allPtrs.sort((a,b)=>a<b?-1:a>b?1:0);
          let next=0n;
          for(const q of allPtrs){ if(q>ptr){next=q;break;} }
          let size=512;
          if(next>ptr){ const d=Number(next-ptr); if(d>0&&d<=2048) size=d; }
          const off=elf.vaToOff(ptr);
          size=Math.min(size,2048,elf.buf.byteLength-off);
          const code=elf.b.subarray(off,off+size);
          log.push((h.type?.name?h.type.name+".":"")+h.name);
          log.push("  VA: "+hex(ptr)+" / pointerIndex: "+h.pointerIndex+" / bytes: "+size);
          for(let i=0;i<code.length;i+=16){
            const chunk=Array.from(code.subarray(i,i+16)).map(x=>x.toString(16).padStart(2,"0")).join(" ");
            log.push((off+i).toString(16).padStart(8,"0")+": "+chunk);
          }
          log.push("");
        }catch(e){ log.push("  helper extract error: "+String(e)); }
      }
    }
  }



  function diagnoseLive1500(meta,log){
    log.push("");
    log.push("[Lv.1500 시스템 후보 탐색 build13]");

    function readCompressedUInt32At(off){
      const v=meta.rawView; let p=off; const first=v.getUint8(p++); let val;
      if((first&0x80)===0) val=first;
      else if((first&0xC0)===0x80) val=((first&0x7F)<<8)|v.getUint8(p++);
      else if((first&0xE0)===0xC0) val=(((first&0x3F)*0x1000000)+(v.getUint8(p++)<<16)+(v.getUint8(p++)<<8)+v.getUint8(p++))>>>0;
      else if(first===0xF0){val=v.getUint32(p,true);p+=4;}
      else if(first===0xFE) val=0xFFFFFFFE;
      else if(first===0xFF) val=0xFFFFFFFF;
      else throw new Error("compressed uint");
      return {value:val>>>0,next:p};
    }
    function readCompressedInt32At(off){
      const r=readCompressedUInt32At(off), e=r.value>>>0;
      if(e===0xFFFFFFFF) return -2147483648;
      return (e&1)?-((e>>>1)+1):(e>>>1);
    }
    function ownerType(fieldIndex){
      for(const t of meta.typeDefs){
        if(t.firstFieldIdx>=0 && fieldIndex>=t.firstFieldIdx && fieldIndex<t.firstFieldIdx+t.fieldCount) return t;
      }
      return null;
    }

    const hits1500=[];
    for(const [fi,dv] of meta.fieldDefaults){
      if(dv.dataIndex<0 || dv.dataIndex>=meta.defaultDataSize) continue;
      try{
        const val=readCompressedInt32At(meta.defaultDataOffset+dv.dataIndex);
        if(val===1500){
          const fld=meta.fields[fi], t=ownerType(fi);
          hits1500.push({fi,name:fld?.name||"?",type:t?.name||"?",token:fld?.token||0});
        }
      }catch(e){}
    }
    log.push("compressed int 기본값 1500 필드: "+hits1500.length);
    for(const h of hits1500.slice(0,200)) log.push("  "+h.type+"."+h.name+" field#"+h.fi+" token="+hex(BigInt(h.token),8));

    const rx=/(transcend|resonan|engr(?:av|ave)|dimension|crystal|core|awak|ascen)/i;
    const types=meta.typeDefs.filter(t=>rx.test(t.name)||rx.test(t.namespace||""));
    log.push("관련 이름 타입: "+types.length);
    for(const t of types.slice(0,300)) log.push("  type#"+t.index+" "+(t.namespace?t.namespace+".":"")+t.name);

    const methods=meta.allMethods.filter(m=>rx.test(m.name)||rx.test(m.type?.name||""));
    log.push("관련 이름 메서드: "+methods.length);
    for(const m of methods.slice(0,1200)){
      const ps=(m.parameterCount>0&&m.parameterStart>=0)?meta.parameters.slice(m.parameterStart,m.parameterStart+m.parameterCount):[];
      log.push("  #"+m.defIndex+" "+(m.type?.name||"?")+"."+m.name+"("+ps.map(p=>p.name).join(", ")+") token="+hex(m.token,8));
    }

    const v=meta.rawView,b=meta.rawBytes;
    const litOff=v.getUint32(8,true), litSize=v.getInt32(12,true);
    const litDataOff=v.getUint32(16,true), litDataSize=v.getInt32(20,true);
    const LIT_SIZE=8, litCount=litSize/LIT_SIZE;
    const literals=[];
    for(let i=0;i<litCount;i++){
      const o=litOff+i*LIT_SIZE, len=v.getUint32(o,true), di=v.getInt32(o+4,true);
      if(di<0||len>100000||di+len>litDataSize) continue;
      literals.push({i,len,di});
    }
    const terms=["청람결정","성해공명","차원각인","영겁성핵","청람","성해","차원","영겁","growth_transcendence_price_v3","growth_transcendence_600"];
    const dec=new TextDecoder();
    for(const term of terms){
      const pat=new TextEncoder().encode(term);
      let found=[];
      outer: for(const li of literals){
        const st=litDataOff+li.di, ed=st+li.len;
        if(li.len<pat.length) continue;
        for(let p=st;p+pat.length<=ed;p++){
          let ok=true;
          for(let j=0;j<pat.length;j++) if(b[p+j]!==pat[j]){ok=false;break;}
          if(ok){
            found.push({idx:li.i,text:dec.decode(b.subarray(st,ed))});
            if(found.length>=20) break outer;
            break;
          }
        }
      }
      log.push("string literal '"+term+"' hits="+found.length);
      for(const h of found) log.push("  literal#"+h.idx+" = "+JSON.stringify(h.text));
    }
  }


  function mapTargetStringLiteralOwners(meta,elf,modules,log){
    log.push("");
    log.push("[4종 이름 문자열 코드 참조 역추적 build15]");
    const targets=["청람결정","성해공명","차원각인","영겁성핵"];
    const v=meta.rawView,b=meta.rawBytes;
    const litOff=v.getUint32(8,true), litSize=v.getInt32(12,true);
    const litDataOff=v.getUint32(16,true), litDataSize=v.getInt32(20,true);
    const dec=new TextDecoder();
    const exact=new Map();
    for(let i=0;i<litSize/8;i++){
      const o=litOff+i*8, len=v.getUint32(o,true), di=v.getInt32(o+4,true);
      if(di<0||len>100000||di+len>litDataSize) continue;
      const txt=dec.decode(b.subarray(litDataOff+di,litDataOff+di+len));
      if(targets.includes(txt)) exact.set(txt,i);
    }
    const addrInfo=new Map();
    for(const t of targets){
      if(!exact.has(t)){ log.push("  "+t+" literal 없음"); continue; }
      const idx=exact.get(t), encoded=(5n<<29n)|BigInt(idx);
      const usageVAs=elf.refs(encoded);
      log.push("  "+t+" literal#"+idx+" encoded="+hex(encoded)+" usageVAs="+usageVAs.length);
      for(const u of usageVAs){
        if(!addrInfo.has(u.toString())) addrInfo.set(u.toString(),[]);
        addrInfo.get(u.toString()).push({name:t,kind:"usage",addr:u});
        const slots=elf.refs(u);
        log.push("    usage "+hex(u)+" <- refs "+slots.map(hex).join(", "));
        for(const slot of slots){
          if(!addrInfo.has(slot.toString())) addrInfo.set(slot.toString(),[]);
          addrInfo.get(slot.toString()).push({name:t,kind:"slot",addr:slot,usage:u});
        }
      }
    }
    if(!addrInfo.size){ log.push("  추적 가능한 usage/slot 주소 없음"); return; }

    const directRefAddrs=[...addrInfo.values()].flatMap(v=>v.map(x=>x.addr));
    const mod=modules.find(m=>m.name==="Assembly-CSharp.dll");
    if(!mod){ log.push("  Assembly-CSharp.dll module 없음"); return; }

    const methods=[];
    const seen=new Set();
    for(const am of meta.allMethods){
      if(am.image?.name!=="Assembly-CSharp.dll") continue;
      if(am.pointerIndex<0||am.pointerIndex>=mod.methodPointerCount) continue;
      try{
        const va=elf.readPtrVA(mod.methodPointers+BigInt(am.pointerIndex*8));
        if(!va||!elf.inExec(va)||seen.has(va.toString())) continue;
        seen.add(va.toString());
        methods.push({...am,va,full:(am.type?.name?am.type.name+".":"")+am.name});
      }catch(e){}
    }
    methods.sort((x,y)=>x.va<y.va?-1:x.va>y.va?1:0);

    function ownerOfAddress(pc){
      let lo=0,hi=methods.length-1,best=-1;
      while(lo<=hi){
        const mid=(lo+hi)>>1;
        if(methods[mid].va<=pc){best=mid;lo=mid+1;} else hi=mid-1;
      }
      if(best<0) return null;
      const m=methods[best];
      const next=best+1<methods.length?methods[best+1].va:0n;
      if(next && pc>=next) return null;
      if(pc-m.va>65536n) return null;
      return m;
    }
    log.push("");
    log.push("[usage 직접 ref 주소 소유 메서드 build16]");
    const directSeen=new Set();
    for(const [addrKey,infos] of addrInfo){
      const addr=BigInt(addrKey);
      if(!elf.inExec(addr)) continue;
      const m=ownerOfAddress(addr);
      const names=[...new Set(infos.map(x=>x.name))].join("/");
      log.push("  "+names+" ref="+hex(addr)+" -> "+(m?(m.full+" #"+m.defIndex+" VA="+hex(m.va)+" +0x"+(addr-m.va).toString(16)):"<owner 없음>"));
      if(m) directSeen.add(m.defIndex);
    }

    function sx(v,bits){
      const sign=1n<<BigInt(bits-1), mask=(1n<<BigInt(bits))-1n;
      let x=BigInt(v)&mask; return (x&sign)?x-(1n<<BigInt(bits)):x;
    }
    function note(hits,m,pc,addr,via){
      const info=addrInfo.get(addr.toString());
      if(info) hits.push({m,pc,addr,via,info});
    }

    const hits=[];
    for(let mi=0;mi<methods.length;mi++){
      const m=methods[mi];
      let size=2048;
      if(mi+1<methods.length){
        const d=Number(methods[mi+1].va-m.va);
        if(d>0&&d<=16384) size=d;
      }
      let off;
      try{ off=elf.vaToOff(m.va); }catch(e){continue}
      size=Math.min(size,16384,elf.buf.byteLength-off);
      const regs=new Array(31).fill(null);
      for(let rel=0;rel+4<=size;rel+=4){
        const w=elf.v.getUint32(off+rel,true)>>>0;
        const pc=m.va+BigInt(rel);

        // ADRP Xd, page
        if((w&0x9F000000)===0x90000000){
          const rd=w&31, immlo=(w>>>29)&3, immhi=(w>>>5)&0x7ffff;
          const imm21=(BigInt(immhi)<<2n)|BigInt(immlo);
          const page=(pc&~0xfffn)+(sx(imm21,21)<<12n);
          if(rd<31) regs[rd]={addr:page,pc};
          note(hits,m,pc,page,"ADRP-page");
          continue;
        }

        // ADD Xd, Xn, #imm12 {, LSL #12}
        if((w&0xFF000000)===0x91000000){
          const rd=w&31, rn=(w>>>5)&31, sh=(w>>>22)&1, imm12=(w>>>10)&0xfff;
          const r=rn<31?regs[rn]:null;
          if(r && pc-r.pc<=128n){
            const addr=r.addr+(BigInt(imm12)<<(sh?12n:0n));
            if(rd<31) regs[rd]={addr,pc};
            note(hits,m,pc,addr,"ADRP+ADD");
          } else if(rd<31) regs[rd]=null;
          continue;
        }

        // LDR Xt, [Xn,#imm12*8]
        if((w&0xFFC00000)===0xF9400000){
          const rt=w&31, rn=(w>>>5)&31, imm12=(w>>>10)&0xfff;
          const r=rn<31?regs[rn]:null;
          if(r && pc-r.pc<=128n){
            const mem=r.addr+BigInt(imm12*8);
            note(hits,m,pc,mem,"ADRP/ADD+LDR-mem");
            try{
              const val=elf.readPtrVA(mem);
              note(hits,m,pc,val,"ADRP/ADD+LDR-value");
              if(rt<31) regs[rt]={addr:val,pc};
            }catch(e){ if(rt<31) regs[rt]=null; }
          } else if(rt<31) regs[rt]=null;
          continue;
        }

        // LDR Xt, literal
        if((w&0xFF000000)===0x58000000){
          const rt=w&31, imm19=(w>>>5)&0x7ffff;
          const mem=pc+(sx(BigInt(imm19),19)<<2n);
          note(hits,m,pc,mem,"LDR-literal-mem");
          try{
            const val=elf.readPtrVA(mem);
            note(hits,m,pc,val,"LDR-literal-value");
            if(rt<31) regs[rt]={addr:val,pc};
          }catch(e){ if(rt<31) regs[rt]=null; }
          continue;
        }
      }
    }

    const byMethod=new Map();
    for(const h of hits){
      if(!byMethod.has(h.m.defIndex)) byMethod.set(h.m.defIndex,{m:h.m,refs:[]});
      byMethod.get(h.m.defIndex).refs.push(h);
    }
    log.push("  코드 참조 hit="+hits.length+" / 메서드="+byMethod.size);
    const selected=[...byMethod.values()];
    for(const defIndex of directSeen){
      if(!selected.some(g=>g.m.defIndex===defIndex)){
        const m=methods.find(x=>x.defIndex===defIndex);
        if(m) selected.push({m,refs:[]});
      }
    }
    for(const g of selected){
      log.push("  "+g.m.full+" #"+g.m.defIndex+" VA="+hex(g.m.va));
      const seenRef=new Set();
      for(const h of g.refs){
        const names=[...new Set(h.info.map(x=>x.name))].join("/");
        const kinds=[...new Set(h.info.map(x=>x.kind))].join("/");
        const k=names+"|"+h.addr+"|"+h.via;
        if(seenRef.has(k)) continue; seenRef.add(k);
        log.push("    "+names+" ["+kinds+"] "+h.via+" addr="+hex(h.addr)+" at "+hex(h.pc));
      }
    }

    log.push("");
    log.push("[4종 이름 참조 메서드 코드 build15]");
    for(const g of selected){
      const h=g.m;
      try{
        const pos=methods.findIndex(x=>x.va===h.va);
        let size=2048;
        if(pos>=0&&pos+1<methods.length){
          const d=Number(methods[pos+1].va-h.va);
          if(d>0&&d<=16384) size=d;
        }
        const off=elf.vaToOff(h.va);
        size=Math.min(size,16384,elf.buf.byteLength-off);
        const code=elf.b.subarray(off,off+size);
        log.push(h.full+" #"+h.defIndex+" VA="+hex(h.va)+" bytes="+size);
        const calls=decodeDirectCalls({functionVA:h.va,codeBytes:code});
        for(const c of calls){
          const callee=methods.find(x=>x.va===c.target);
          log.push("  call "+hex(c.at)+" -> "+hex(c.target)+(callee?" "+callee.full:""));
        }
        for(let i=0;i<code.length;i+=16){
          const chunk=Array.from(code.subarray(i,i+16)).map(x=>x.toString(16).padStart(2,"0")).join(" ");
          log.push((off+i).toString(16).padStart(8,"0")+": "+chunk);
        }
        log.push("");
      }catch(e){ log.push(h.full+" extract error: "+String(e)); }
    }
  }

  function scanKnownUserCostPatterns(meta,elf,modules,log){
    log.push("");
    log.push("[사용자 확정 4종 비용 패턴 역추적 build14]");
    const pats=[
      ["청람결정",[500,1000,2000,3000,...Array(11).fill(4000)]],
      ["성해공명",[1000,1500,2500,4000,...Array(11).fill(5000)]],
      ["차원각인",[1500,2500,4000,6000,...Array(11).fill(7500)]],
      ["영겁성핵",[2000,3000,5000,7000,...Array(11).fill(8500)]]
    ];
    function bytesFor(vals){
      const a=new Uint8Array(vals.length*4),v=new DataView(a.buffer);
      vals.forEach((x,i)=>v.setInt32(i*4,x,true)); return a;
    }
    function hitsIn(bytes,pat,start=0,end=bytes.length,max=50){
      const out=[];
      outer: for(let i=start;i+pat.length<=end;i++){
        if(bytes[i]!==pat[0]) continue;
        for(let j=1;j<pat.length;j++) if(bytes[i+j]!==pat[j]) continue outer;
        out.push(i); if(out.length>=max) break;
      }
      return out;
    }
    const defaults=[...meta.fieldDefaults.values()].filter(x=>x.dataIndex>=0).sort((a,b)=>a.dataIndex-b.dataIndex);
    function fieldForMetaOffset(abs){
      const rel=abs-meta.defaultDataOffset;
      if(rel<0||rel>=meta.defaultDataSize) return null;
      let best=null;
      for(const d of defaults){
        if(d.dataIndex<=rel) best=d; else break;
      }
      if(!best) return null;
      const fld=meta.fields[best.fieldIndex];
      let owner=null;
      for(const t of meta.typeDefs){
        if(t.firstFieldIdx>=0 && best.fieldIndex>=t.firstFieldIdx && best.fieldIndex<t.firstFieldIdx+t.fieldCount){owner=t;break;}
      }
      return {rel,best,fld,owner,delta:rel-best.dataIndex};
    }
    for(const [name,vals] of pats){
      const full=bytesFor(vals), first5=bytesFor(vals.slice(0,5));
      const mh=hitsIn(meta.rawBytes,full);
      const m5=mh.length?[]:hitsIn(meta.rawBytes,first5);
      log.push("  "+name+" metadata fullHits="+mh.length+" first5Hits="+m5.length);
      for(const off of [...mh,...m5].slice(0,20)){
        const x=fieldForMetaOffset(off);
        log.push("    meta off="+hex(BigInt(off))+(x?" defaultRel="+x.rel+" nearest="+(x.owner?x.owner.name+".":"")+(x.fld?.name||"?")+" field#"+x.best.fieldIndex+" delta="+x.delta:""));
      }
      let eh=[];
      for(const sec of elf.segs){
        const hs=hitsIn(elf.b,full,sec.offset,Math.min(elf.b.length,sec.offset+sec.filesz),20);
        for(const off of hs) eh.push(sec.va+BigInt(off-sec.offset));
      }
      if(!eh.length){
        for(const sec of elf.segs){
          const hs=hitsIn(elf.b,first5,sec.offset,Math.min(elf.b.length,sec.offset+sec.filesz),20);
          for(const off of hs) eh.push(sec.va+BigInt(off-sec.offset));
        }
      }
      log.push("    ELF pattern VAs="+eh.slice(0,30).map(hex).join(", "));
    }
  }


  function dumpGrowthStoneMatrixAndNameArrays(meta,elf,log){
    log.push("");
    log.push("[GrowthStone 비용행렬 / 이름배열 직접복원 build17]");

    function stringLiteralByIndex(idx){
      const v=meta.rawView,b=meta.rawBytes;
      const litOff=v.getUint32(8,true), litSize=v.getInt32(12,true);
      const litDataOff=v.getUint32(16,true), litDataSize=v.getInt32(20,true);
      if(idx<0 || idx>=litSize/8) return null;
      const o=litOff+idx*8, len=v.getUint32(o,true), di=v.getInt32(o+4,true);
      if(di<0||len>100000||di+len>litDataSize) return null;
      return new TextDecoder().decode(b.subarray(litDataOff+di,litDataOff+di+len));
    }
    function decodeUsageSlot(slotVA){
      try{
        const usageVA=elf.readPtrVA(slotVA);
        const encoded=elf.readPtrVA(usageVA);
        const tag=Number((encoded>>29n)&7n), idx=Number(encoded&0x1fffffffn);
        return {slotVA,usageVA,encoded,tag,idx};
      }catch(e){ return {slotVA,error:String(e.message||e)}; }
    }
    function ownerTypeOfField(fi){
      for(const t of meta.typeDefs){
        if(t.firstFieldIdx>=0 && fi>=t.firstFieldIdx && fi<t.firstFieldIdx+t.fieldCount) return t;
      }
      return null;
    }

    // GrowthStoneTranscendence..cctor:
    // x19 <- [0x3E003D0], then RuntimeHelpers.InitializeArray(array, [x19])
    const gs=decodeUsageSlot(0x3E003D0n);
    log.push("GrowthStone Costs field slot 0x3E003D0");
    if(gs.error){ log.push("  ERROR "+gs.error); }
    else{
      log.push("  usageVA="+hex(gs.usageVA)+" encoded="+hex(gs.encoded)+" tag="+gs.tag+" idx="+gs.idx);
      if(gs.tag===4){
        const fr=meta.fieldRefs[gs.idx];

          log.push("  fieldRef typeIndex="+fr.typeIndex+" relativeField="+fr.fieldIndex);
          // Resolve relative field against every <PrivateImplementationDetails> type.
          for(const t of meta.typeDefs){
            if(t.name!=="<PrivateImplementationDetails>") continue;
            if(fr.fieldIndex<0 || fr.fieldIndex>=t.fieldCount) continue;
            const fi=t.firstFieldIdx+fr.fieldIndex, fld=meta.fields[fi], dv=meta.fieldDefaults.get(fi);
            log.push("  candidate "+t.name+" field#"+fi+" "+(fld?.name||"?")+" token="+hex(BigInt(fld?.token||0)));
            if(dv && dv.dataIndex>=0 && dv.dataIndex<meta.defaultDataSize){
              const start=meta.defaultDataOffset+dv.dataIndex;
              const next=[...meta.fieldDefaults.values()]
                .filter(x=>x.dataIndex>dv.dataIndex).map(x=>x.dataIndex).sort((a,b)=>a-b)[0] ?? meta.defaultDataSize;
              const bytes=Math.min(next-dv.dataIndex,512);
              log.push("    dataIndex="+dv.dataIndex+" inferredBytes="+bytes);
              const vals=[];

      const longs=[]; for(let i=0;i<2;i++) longs.push(dv.getBigInt64(i*8,true).toString());
      log.push("  dimension blob @0x9274D0 raw="+raw.map(x=>x.toString(16).padStart(2,"0")).join("")+" i32=["+ints.join(", ")+"] i64=["+longs.join(", ")+"]");
    }catch(e){ log.push("  dimension blob error: "+String(e.message||e)); }

    const arrays=[
      ["TranscendGrowthPlaceholderNames",0x40n,[0x3DEAC70n,0x3DEACA8n,0x3DEAC80n,0x3DEAC30n,0x3DEABF8n,0x3DEAC88n,0x3DEAC60n,0x3DEAC08n]],
      ["TranscendenceShortEffects",0x58n,[0x3DEAC90n,0x3DEAC48n,0x3DEAC38n,0x3DEAC50n,0x3DEAC10n,0x3DEACC0n,0x3DEAC98n,0x3DEAC78n]],
      ["TranscendenceEffectNames",0x60n,[0x3DEAC68n,0x3DEAC20n,0x3DEAC00n,0x3DEAC28n,0x3DEAC58n,0x3DEACE8n,0x3DEACB8n,0x3DEAC18n]]
    ];
    for(const [name,staticOff,slots] of arrays){
      log.push(name+" staticOffset=0x"+staticOff.toString(16));
      for(let i=0;i<slots.length;i++){
        const d=decodeUsageSlot(slots[i]);
        if(d.error){ log.push("  ["+i+"] slot="+hex(slots[i])+" ERROR "+d.error); continue; }
        let extra="";
        if(d.tag===5){
          const txt=stringLiteralByIndex(d.idx);
          extra=" string="+JSON.stringify(txt);
        } else if(d.tag===4){
          const fr=meta.fieldRefs[d.idx];
          extra=" fieldRef="+JSON.stringify(fr||null);
        }
        log.push("  ["+i+"] slot="+hex(slots[i])+" usage="+hex(d.usageVA)+" encoded="+hex(d.encoded)+" tag="+d.tag+" idx="+d.idx+extra);
      }
    }
  }

  function dumpGoldInitializerBlobs(meta,elf,log){
    log.push("");
    log.push("[Gold 초월 정적 초기값 직접 복원 build9]");
    const slotVAs=[
      0x3DEABA8n, // MaxMultiplierExponent array handle slot
      0x3DEABB0n, // MaxChapterForSlot array handle slot
      0x3DEABB8n, // StartChapterForSlot array handle slot
      0x3DEABC0n
    ];
    function fmtInts(dataOff){
      const vals=[];
      for(let i=0;i<8;i++){
        const o=meta.defaultDataOffset+dataOff+i*4;
        if(o+4>meta.rawView.byteLength) break;
        vals.push(meta.rawView.getInt32(o,true));
      }
      return vals;
    }
    function dumpField(globalIndex,prefix=""){
      const fld=meta.fields[globalIndex];
      if(!fld){ log.push(prefix+"field#"+globalIndex+" 없음"); return null; }
      const dv=meta.fieldDefaults.get(globalIndex);
      log.push(prefix+"field#"+globalIndex+" "+fld.name+" token="+hex(BigInt(fld.token),8)+(dv?" dataIndex="+dv.dataIndex:" no-default"));
      if(dv && dv.dataIndex>=0 && dv.dataIndex+32<=meta.defaultDataSize){
        const vals=fmtInts(dv.dataIndex);
        log.push(prefix+"  int32[8] = ["+vals.join(", ")+"]");
        return vals;
      }
      return null;
    }

    const privateTypes=meta.typeDefs.filter(t=>{
      if(t.name!=="<PrivateImplementationDetails>") return false;
      const img=meta.images.find(x=>t.index>=x.typeStart && t.index<x.typeStart+x.typeCount);
      return img?.name==="Assembly-CSharp.dll";
    });
    log.push("Assembly-CSharp <PrivateImplementationDetails> 후보: "+privateTypes.length);
    for(const t of privateTypes){
      log.push("  type#"+t.index+" token="+hex(BigInt(t.token),8)+" firstField="+t.firstFieldIdx+" fieldCount="+t.fieldCount);
    }

    for(let si=0;si<slotVAs.length;si++){
      const slot=slotVAs[si];
      log.push("slot"+si+" @ "+hex(slot));
      try{
        const usageSlot=elf.readPtrVA(slot);
        const encoded=elf.readPtrVA(usageSlot);
        const tag=Number((encoded>>29n)&7n);
        const idx=Number(encoded & 0x1fffffffn);
        log.push("  usage slot VA: "+hex(usageSlot));
        log.push("  encoded metadata usage: "+hex(encoded)+" / tag="+tag+" / low29 index="+idx);
        if(tag===4){
          const fr=meta.fieldRefs[idx];
          if(!fr){
            log.push("  fieldRefs["+idx+"] 없음");
            continue;
          }
          log.push("  fieldRef["+idx+"]: typeIndex="+fr.typeIndex+" / fieldIndex(relative)="+fr.fieldIndex);
          let resolved=0;
          for(const t of privateTypes){
            if(fr.fieldIndex<0 || fr.fieldIndex>=t.fieldCount) continue;
            const g=t.firstFieldIdx+fr.fieldIndex;
            log.push("  <PrivateImplementationDetails> 기준 해석:");
            const vals=dumpField(g,"    ");
            if(vals) resolved++;
          }
          if(!resolved) log.push("  PrivateImplementationDetails 기준 정적 배열 해석 실패");
        }else{
          log.push("  tag 4(FieldInfo)가 아님");
        }
      }catch(e){
        log.push("  decode error: "+String(e.message||e));
      }
    }
  }

  function dumpRelatedMethods(meta,elf,modules,log){
    const modByName=new Map(modules.map(m=>[m.name,m]));
    const vaNames=new Map();
    const resolved=[];
    for(const am of meta.allMethods){
      const mod=modByName.get(am.image?.name||"");
      if(!mod || am.pointerIndex<0 || am.pointerIndex>=mod.methodPointerCount) continue;
      try{
        const va=elf.readPtrVA(mod.methodPointers+BigInt(am.pointerIndex*8));
        const full=(am.type?.name?am.type.name+".":"")+am.name;
        if(!vaNames.has(va.toString())) vaNames.set(va.toString(),full);
        resolved.push({...am,va,mod,full});
      }catch(e){}
    }
    const picks=resolved.filter(am => {
      if(am.image?.name!=="Assembly-CSharp.dll") return false;
      if(am.type?.name==="Game_grow" && (/transcend/i.test(am.name) || am.name===".cctor")) return true;
      if(/transcend/i.test(am.type?.name||"")) return true;
      if(am.type?.name==="ChuTiCheet" && /transcend/i.test(am.name)) return true;
      if(am.type?.name==="TranscendenceBalance" && (
        am.name===".cctor" ||
        am.name==="GetStageEquivalentMultiplier" ||
        am.name==="GetSkyArtMultiplierAtLevel" ||
        am.name==="GetPrecisionDefenseBonusAtLevel"
      )) return true;
      return false;
    });
    log.push("");
    log.push("[관련 메서드 상세 추출]");
    log.push("후보 수: "+picks.length);
    for(const h of picks){
      try{
        const mod=h.mod, ptr=h.va;
        const allPtrs=[];
        for(let i=0;i<mod.methodPointerCount;i++){
          const q=elf.readPtrVA(mod.methodPointers+BigInt(i*8));
          if(q>0n) allPtrs.push(q);
        }
        allPtrs.sort((a,b)=>a<b?-1:a>b?1:0);
        let next=0n;
        for(const q of allPtrs){ if(q>ptr){next=q;break;} }
        let size=2048;
        if(next>ptr){ const d=Number(next-ptr); if(d>0&&d<=16384) size=d; }
        const off=elf.vaToOff(ptr);
        size=Math.min(size,16384,elf.buf.byteLength-off);
        const code=elf.b.subarray(off,off+size);
        const temp={functionVA:ptr,codeBytes:code};
        log.push(h.full);
        log.push("  MethodDef index: "+h.defIndex+" / pointerIndex: "+h.pointerIndex);
        const ps=(h.parameterCount>0 && h.parameterStart>=0)?meta.parameters.slice(h.parameterStart,h.parameterStart+h.parameterCount):[];
        log.push("  params: "+(ps.length?ps.map((p,ix)=>"#"+ix+" "+p.name+" (typeIndex="+p.typeIndex+")").join(", "):"(none)"));
        log.push("  VA: "+hex(ptr)+" / file offset: "+hex(BigInt(off))+" / bytes: "+size);
        const calls=decodeDirectCalls(temp);
        if(calls.length){
          log.push("  direct calls:");
          for(const c of calls){
            const nm=vaNames.get(c.target.toString());
            log.push("    "+hex(c.at)+" -> "+hex(c.target)+(nm?"  "+nm:""));
          }
        }
        for(let i=0;i<code.length;i+=16){
          const chunk=Array.from(code.subarray(i,i+16)).map(x=>x.toString(16).padStart(2,"0")).join(" ");
          log.push((off+i).toString(16).padStart(8,"0")+": "+chunk);
        }
        log.push("");
      }catch(e){
        log.push(h.full+" extract error: "+String(e));
      }
    }
  }

  $("run").addEventListener("click", async () => {
    const mf=$("meta").files[0], lf=$("lib").files[0];
    if(!mf||!lf){$("status").innerHTML='<span class="bad">두 파일을 모두 선택하세요.</span>';return}
    $("run").disabled=true;$("status").textContent="분석 중…";$("out").textContent="분석 중…";
    const log=[];
    try{
      const [mb,lb]=await Promise.all([mf.arrayBuffer(),lf.arrayBuffer()]);
      const meta=parseMetadata(mb);
      log.push("Metadata Version: "+meta.version);
      log.push("Method definitions: "+meta.methodCount.toLocaleString());
      log.push("Type definitions: "+meta.typeCount.toLocaleString());
      log.push("Images: "+meta.imageCount.toLocaleString());
      log.push("");
      log.push("[대상 메서드 metadata 매칭]");
      if(!meta.methods.length) log.push("대상 메서드를 찾지 못함");
      for(const m of meta.methods){
        log.push(m.target);
        log.push("  MethodDef index: "+m.defIndex);
        log.push("  methodIndex(v31 metadata): 없음 (token 기반)");
        log.push("  token: "+hex(m.token,8)+" / pointerIndex: "+m.pointerIndex);
        log.push("  declaringType: "+(m.type.namespace?m.type.namespace+".":"")+m.type.name+" (#"+m.declaringType+")");
        log.push("  image: "+(m.image?.name||"?"));
        const ps=(m.parameterCount>0 && m.parameterStart>=0)?meta.parameters.slice(m.parameterStart,m.parameterStart+m.parameterCount):[];
        log.push("  params: "+(ps.length?ps.map((p,ix)=>"#"+ix+" "+p.name+" (typeIndex="+p.typeIndex+")").join(", "):"(none)"));
      }
      log.push("");
      const elf=parseElf(lb);
      log.push("ELF64 ARM64 확인");
      log.push("LOAD segments: "+elf.segs.length+" / exec "+elf.exec.length+" / data "+elf.data.length);
      log.push("RELA entries: "+elf.relocationSeen.toLocaleString()+" / 적용: "+elf.relocationApplied.toLocaleString());
      let cr=null;
      try{
        cr=findCodeRegistration(elf,meta.imageCount,log);
      }catch(e){
        log.push("CodeRegistration 자동 탐색은 실패. CodeGenModule 직접 탐색으로 계속 진행.");
      }
      log.push("");
      const modules=resolveFunctions(meta,elf,cr,log);
      annotateInternalCalls(meta,elf,modules,log);
      diagnoseLive1500(meta,log);
      mapTargetStringLiteralOwners(meta,elf,modules,log);
      dumpGrowthStoneMatrixAndNameArrays(meta,elf,log);
      scanKnownUserCostPatterns(meta,elf,modules,log);
      dumpGoldInitializerBlobs(meta,elf,log);
      log.push("");
      log.push("[초월 관련 타입 필드/상수 build11]");
      function readCompressedUInt32At(off){
        const v=meta.rawView;
        let p=off;
        const first=v.getUint8(p++);
        let val;
        if((first & 0x80)===0){
          val=first>>>0;
        }else if((first & 0xC0)===0x80){
          val=(((first & 0x7F)<<8) | v.getUint8(p++))>>>0;
        }else if((first & 0xE0)===0xC0){
          val=(((first & 0x3F)*0x1000000) + (v.getUint8(p++)<<16) + (v.getUint8(p++)<<8) + v.getUint8(p++))>>>0;
        }else if(first===0xF0){
          val=v.getUint32(p,true); p+=4;
        }else if(first===0xFE){
          val=0xFFFFFFFE;
        }else if(first===0xFF){
          val=0xFFFFFFFF;
        }else{
          throw new Error("invalid compressed uint32 prefix 0x"+first.toString(16));
        }
        return {value:val>>>0,next:p};
      }
      function readCompressedInt32At(off){
        const r=readCompressedUInt32At(off);
        const enc=r.value>>>0;
        if(enc===0xFFFFFFFF) return {value:-2147483648,next:r.next};
        const neg=(enc & 1)!==0;
        const n=enc>>>1;
        return {value:neg?-(n+1):n,next:r.next};
      }
      function defaultRaw(globalFieldIndex){
        const dv=meta.fieldDefaults.get(globalFieldIndex);
        if(!dv || dv.dataIndex<0 || dv.dataIndex>=meta.defaultDataSize) return "";
        const o=meta.defaultDataOffset+dv.dataIndex;
        const out=[];
        try{
          const ci=readCompressedInt32At(o), cu=readCompressedUInt32At(o);
          out.push("compressedI32="+ci.value, "compressedU32="+cu.value);
        }catch(e){ out.push("compressed=ERR"); }
        if(o+8<=meta.rawView.byteLength){
          out.push("rawF64="+meta.rawView.getFloat64(o,true));
        }
        const raw=[];
        for(let k=0;k<Math.min(12,meta.rawView.byteLength-o);k++) raw.push(meta.rawView.getUint8(o+k).toString(16).padStart(2,"0"));
        out.push("raw="+raw.join(""));
        return " default{"+out.join(", ")+"} dataIndex="+dv.dataIndex;
      }
      for(const tn of ["GrowthTranscendenceProgress","GrowthStoneTranscendence","Game_grow","ChuTiCheet"]){
        const ts=meta.typeDefs.filter(t=>t.name===tn);
        if(!ts.length){ log.push(tn+": type 없음"); continue; }
        for(const t of ts){
          log.push(tn+" type#"+t.index+" firstField="+t.firstFieldIdx+" fieldCount="+t.fieldCount);
          for(let fi=0;fi<t.fieldCount;fi++){
            const g=t.firstFieldIdx+fi, fld=meta.fields[g];
            if(!fld) continue;
            if((tn==="Game_grow" || tn==="ChuTiCheet") && !/transcend/i.test(fld.name)) continue;
            log.push("  field#"+g+" "+fld.name+" (typeIndex="+fld.typeIndex+") token="+hex(BigInt(fld.token),8)+defaultRaw(g));
          }
        }
      }

      log.push("");
      log.push("[초월 관련 메서드 목록 build11]");
      for(const tn of ["GrowthTranscendenceProgress","GrowthStoneTranscendence"]){
        const arr=meta.allMethods.filter(m=>m.type?.name===tn && m.image?.name==="Assembly-CSharp.dll");
        log.push(tn+" methods="+arr.length);
        for(const m of arr){
          const ps=(m.parameterCount>0 && m.parameterStart>=0)?meta.parameters.slice(m.parameterStart,m.parameterStart+m.parameterCount):[];
          log.push("  #"+m.defIndex+" "+m.name+"("+ps.map(p=>p.name).join(", ")+") token="+hex(m.token,8));
        }
      }
      dumpRelatedMethods(meta,elf,modules,log);
      log.push("");
      log.push("[실제 함수 주소]");
      for(const m of meta.methods){
        log.push(m.target);
        if(m.resolveError){log.push("  ERROR: "+m.resolveError);continue}
        log.push("  module: "+m.module);
        log.push("  VA: "+hex(m.functionVA));
        log.push("  file offset: "+hex(BigInt(m.functionFileOffset)));
        log.push("  extracted bytes: "+m.codeSize);
        log.push(m.hexDump);
        log.push("");
      }
      const report=log.join("\n");
      $("out").textContent=report;
      $("status").innerHTML='<span class="ok">분석 완료. 아래 TXT를 저장해서 채팅에 올리면 다음 단계(ARM64 함수식 복원)를 바로 이어갈 수 있습니다.</span>';
      const blob=new Blob([report],{type:"text/plain;charset=utf-8"});
      const a=$("download");
      if(a.dataset.url) URL.revokeObjectURL(a.dataset.url);
      const url=URL.createObjectURL(blob);a.href=url;a.dataset.url=url;a.hidden=false;
    }catch(e){
      const msg=(e&&e.stack)?e.stack:String(e);
      $("out").textContent=log.concat(["","ERROR",msg]).join("\n");
      $("status").innerHTML='<span class="bad">분석 실패: '+String(e.message||e)+'</span>';
    }finally{$("run").disabled=false}
  });
})();
</script>
