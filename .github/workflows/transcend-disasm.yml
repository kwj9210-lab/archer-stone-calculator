name: ARM64 transcend disassembly

on:
  push:
    branches:
      - transcend-sim-wip-20260923
    paths:
      - "analysis/archer_il2cpp_probe_report.txt"
      - ".github/workflows/transcend-disasm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install capstone
      - name: Build disassembly
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM

          src = Path("analysis/archer_il2cpp_probe_report.txt").read_text(encoding="utf-8")
          wanted = [
              "CalculateGoldTranscendMultiplierAtLevel",
              "GetTotalGoldTranscendenceAttackMultiplier",
              "GetGoldTranscendCostForTargetLevel",
              "GetGoldTranscendTotalCost",
              "GetTranscendenceCurrentEffectAtLevel",
          ]
          funcs={}
          cur=None;base=None;data=[]
          def flush():
              global cur,base,data
              if cur and base is not None and data:
                  funcs[cur]=(base,bytes(data))
              cur=None;base=None;data=[]
          for line in src.splitlines():
              if line in wanted:
                  flush(); cur=line; continue
              if cur is None: continue
              m=re.match(r"\s*VA:\s*(0x[0-9A-Fa-f]+)",line)
              if m: base=int(m.group(1),16); continue
              m=re.match(r"^[0-9A-Fa-f]{8}:\s*((?:[0-9A-Fa-f]{2}(?:\s+|$))+)",line)
              if m:
                  data.extend(int(x,16) for x in m.group(1).split()); continue
          flush()

          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          out=[]
          for name in wanted:
              va,code=funcs[name]
              out += ["", "="*100, f"{name} VA={va:#x} bytes={len(code)}", "="*100]
              for ins in md.disasm(code,va):
                  extra=""
                  if ins.mnemonic in ("bl","b") and ins.op_str.startswith("#0x"):
                      extra=f" ; target={ins.op_str[1:]}"
                  out.append(f"{ins.address:016x}  {ins.mnemonic:8s} {ins.op_str}{extra}")
          Path("analysis/disassembly.txt").write_text("\n".join(out)+"\n",encoding="utf-8")
          PY
      - name: Commit disassembly result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/disassembly.txt
          if ! git diff --cached --quiet; then
            git commit -m "Generate ARM64 transcend disassembly"
            git push
          fi
