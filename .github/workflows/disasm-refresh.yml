name: Disassemble refresh placeholder

on:
  push:
    branches: [transcend-build12-20260923]
    paths:
      - "analysis/refresh_placeholder_hex.txt"
      - ".github/workflows/disasm-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install capstone
      - run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          src=Path("analysis/refresh_placeholder_hex.txt").read_text()
          data=bytearray()
          base=None
          for line in src.splitlines():
              m=re.match(r'^([0-9a-fA-F]+):\s*((?:[0-9a-fA-F]{2}(?:\s+|$))+)',line)
              if not m: continue
              if base is None: base=int(m.group(1),16)+0x4000
              data.extend(int(x,16) for x in m.group(2).split())
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          out=[]
          for ins in md.disasm(bytes(data),base):
              out.append(f"{ins.address:016x}  {ins.mnemonic:8s} {ins.op_str}")
          Path("analysis/refresh_placeholder_disasm.txt").write_text("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/refresh_placeholder_disasm.txt
          git commit -m "Disassemble refresh placeholder" || exit 0
          git push
