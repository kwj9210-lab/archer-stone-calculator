name: Disasm effect name
on:
  push:
    branches: [transcend-build16-20260923]
    paths:
      - "analysis/disasm_effect_name.py"
      - ".github/workflows/disasm-effect-name.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install capstone
      - run: python analysis/disasm_effect_name.py > analysis/disasm_effect_name.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/disasm_effect_name.txt
          git commit -m "Disassemble effect name" || exit 0
          git push
