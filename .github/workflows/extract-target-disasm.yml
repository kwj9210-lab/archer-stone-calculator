name: Extract target disassembly

on:
  workflow_dispatch:
  push:
    branches: [transcend-build7-20260923]
    paths: [".github/workflows/extract-target-disasm.yml"]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("analysis/build7_disassembly.txt").read_text()
          targets=[
            "Game_grow.GetGoldTranscendMaxMultiplierExponent",
            "Game_grow.CalculateGoldTranscendMultiplierAtLevel",
            "Game_grow.GetTotalGoldTranscendenceAttackMultiplier",
            "Game_grow..cctor",
            "TranscendenceBalance.GetStageEquivalentMultiplier",
            "TranscendenceBalance.GetSkyArtMultiplierAtLevel",
            "TranscendenceBalance.GetPrecisionDefenseBonusAtLevel",
            "TranscendenceBalance..cctor",
          ]
          lines=src.splitlines()
          out=[]
          for t in targets:
            start=None
            for i,line in enumerate(lines):
              if line.startswith(t+" VA="):
                start=i-1
                break
            if start is None:
              out.append(f"MISSING {t}")
              continue
            end=len(lines)
            for j in range(start+2,len(lines)):
              if lines[j].startswith("="*20) and j+1<len(lines) and " VA=" in lines[j+1]:
                end=j
                break
            out.extend(lines[start:end])
            out.append("")
          Path("analysis/target_disassembly.txt").write_text("\n".join(out)+"\n")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/target_disassembly.txt
          git commit -m "Fix target transcend disassembly extraction" || exit 0
          git push
