name: Build7 ARM64 disassembly

on:
  push:
    branches:
      - transcend-build7-20260923
    paths:
      - "analysis/build7_report.txt"
      - ".github/workflows/build7-disasm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install capstone
      - name: Disassemble all extracted functions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM

          src = Path("analysis/build7_report.txt").read_text(encoding="utf-8")
          lines = src.splitlines()
          funcs=[]
          cur=None
          code=[]
          va=None
          def flush():
              global cur, code, va
              if cur and code and va is not None:
                  funcs.append((cur,va,bytes(code)))
              cur=None; code=[]; va=None

          header_re=re.compile(r'^(?:Game_grow|TranscendenceBalance|GrowthTranscendenceProgress|GrowthStoneTranscendence|TrainingTargetBalance|BigDouble|String)\.[^\s]+$')
          for line in lines:
              if header_re.match(line):
                  flush(); cur=line; continue
              if cur is None: continue
              m=re.match(r'\s*VA:\s*(0x[0-9A-Fa-f]+)',line)
              if m: va=int(m.group(1),16); continue
              m=re.match(r'^[0-9A-Fa-f]{8}:\s*((?:[0-9A-Fa-f]{2}(?:\s+|$))+)',line)
              if m:
                  code.extend(int(x,16) for x in m.group(1).split()); continue
              if line.startswith('['):
                  flush()
          flush()

          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          out=[]
          for name,base,blob in funcs:
              out += ["", "="*110, f"{name} VA={base:#x} bytes={len(blob)}", "="*110]
              for ins in md.disasm(blob,base):
                  out.append(f"{ins.address:016x}  {ins.mnemonic:8s} {ins.op_str}")
          Path("analysis/build7_disassembly.txt").write_text("\n".join(out)+"\n",encoding="utf-8")
          print("functions",len(funcs))
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/build7_disassembly.txt
          if ! git diff --cached --quiet; then
            git commit -m "Generate build7 ARM64 disassembly"
            git push
          fi
