<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>궁수키우기 RPG 마석 제작시간 계산기</title>
<style>
:root{--bg:#f4fff8;--bg2:#fff9ea;--card:#fff;--line:#cfe9d9;--text:#29463b;--muted:#71867c;--accent:#35c98c;--strong:#198b64;--shadow:0 8px 22px rgba(69,126,98,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
main{width:min(900px,100%);margin:auto;padding:22px 14px 44px}
h1{margin:0 0 6px;font-size:25px;color:#22694f}.sub{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:16px}
.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:13px}
.card h2{font-size:17px;margin:0 0 12px;padding-left:9px;border-left:4px solid #58cf98;color:#315d4d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.materials{grid-template-columns:repeat(3,minmax(0,1fr))}
label{font-size:12px;font-weight:800;color:#657c72}
input{width:100%;min-height:46px;margin-top:6px;padding:10px 11px;border:1px solid #cde7d7;border-radius:11px;background:#fbfffc;color:var(--text);font-size:16px;font-weight:800;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(53,201,140,.13)}
.hint{margin-top:6px;font-size:11px;color:var(--muted)}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.result{border:1px solid #d7ebdf;border-radius:15px;padding:14px;background:#fbfffc}
.result:nth-child(2){background:#fffdf1;border-color:#eee0aa}.result:nth-child(3){background:#f4fbff;border-color:#cfe7f2}
.grade{font-size:16px;font-weight:900;color:#2b6d53}.time{font-size:25px;font-weight:900;color:#1a9368;margin:8px 0 4px;line-height:1.2}
.meta{font-size:11.5px;color:#687d73;line-height:1.65}.meta b{color:#315d4d}
.break{margin-top:9px;padding-top:9px;border-top:1px solid #e1eee7;font-size:11px;color:#71867c;line-height:1.6}
.note{font-size:11.5px;color:#71867c;line-height:1.6;margin:10px 2px 0}
.bad{color:#c95b5b;font-weight:800}
@media(max-width:700px){main{padding:14px 9px 34px}h1{font-size:21px}.grid,.materials,.results{grid-template-columns:1fr}.card{padding:13px}.time{font-size:22px}}
</style>
</head>
<body><main>
<h1>마석 제작시간 계산기</h1>
<div class="sub">시간당 던전 입장권 획득량·던전 숙련도·현재 재료 보유량을 기준으로 불멸/초월/절대 마석 1개까지 걸리는 예상 시간을 계산합니다.</div>

<section class="card">
<h2>1. 입장권 / 던전 숙련도</h2>
<div class="grid">
<label>1시간 입장권 획득 수
<input id="ticketHour" type="text" inputmode="text" placeholder="예: 81,000,000 또는 8100만"></label>
<label>던전 숙련도 단계
<input id="mastery" type="number" min="1" max="200" step="1" value="160"></label>
</div>
<div id="mult" class="hint">160단계 · ×41.25</div>
</section>

<section class="card">
<h2>2. 현재 재료 보유량</h2>
<div class="grid materials">
<label>비명초
<input id="r0" type="text" inputmode="text" value="0" placeholder="0"></label>
<label>활력수
<input id="r1" type="text" inputmode="text" value="0" placeholder="0"></label>
<label>복원석
<input id="r2" type="text" inputmode="text" value="0" placeholder="0"></label>
</div>
</section>

<section class="card">
<h2>3. 제작 예상시간</h2>
<div id="results" class="results"></div>
<div class="note">각 목표는 현재 보유 재료에서 <b>각각 독립적으로</b> 계산합니다. 보유 하위 마석은 반영하지 않고, 목표 마석을 원재료부터 전부 신규 제작하는 기준입니다. 소탕 1회당 던전 입장권 2장을 사용하며 재료별 던전은 각각 따로 계산합니다.</div>
</section>

<script>
const base100k=[1526775,2508670,4587000]; // 기존 각인석 계산기와 동일: 숙련도 ×5.00 기준 10만 소탕
const targetReq={
  "불멸 마석":247880000,
  "초월 마석":1091520000,
  "절대 마석":4966080000
};
function parseAmount(raw){
  let s=String(raw??"").trim().replace(/,/g,"").replace(/\s+/g,"");
  if(!s)return 0;
  if(/^\d+(?:\.\d+)?$/.test(s))return Number(s);
  const units=[["조",1e12],["억",1e8],["만",1e4]];
  let total=0,used=false;
  for(const [u,mul] of units){
    const m=s.match(new RegExp("(\\d+(?:\\.\\d+)?)"+u));
    if(m){total+=Number(m[1])*mul;s=s.replace(m[0],"");used=true;}
  }
  if(/^\d+(?:\.\d+)?$/.test(s)&&s!==""){total+=Number(s);used=true;s="";}
  return used&&s===""?total:NaN;
}
const fmt=n=>Math.round(n).toLocaleString("ko-KR");
function duration(hours){
  if(!Number.isFinite(hours))return "입장권 획득량 입력 필요";
  if(hours<=0)return "즉시 제작 가능";
  if(hours<1)return Math.ceil(hours*60)+"분";
  const d=Math.floor(hours/24),h=Math.floor(hours-d*24),m=Math.round((hours-d*24-h)*60);
  const a=[]; if(d)a.push(d+"일"); if(h)a.push(h+"시간"); if(m)a.push(m+"분");
  return a.join(" ")||"1분 미만";
}
function calculate(){
  const level=Math.max(1,Math.min(200,Math.floor(Number(document.getElementById("mastery").value)||1)));
  document.getElementById("mastery").value=level;
  const mult=1.25+.25*level;
  document.getElementById("mult").textContent=level+"단계 · ×"+mult.toFixed(2);
  const ticketHour=parseAmount(document.getElementById("ticketHour").value);
  const stock=[0,1,2].map(i=>parseAmount(document.getElementById("r"+i).value));
  const invalid=!Number.isFinite(ticketHour)||stock.some(v=>!Number.isFinite(v));
  if(invalid){
    document.getElementById("results").innerHTML='<div class="bad">입력값을 확인해 주세요. 숫자, 콤마, 조/억/만 표기를 사용할 수 있습니다.</div>';
    return;
  }
  const per100k=base100k.map(v=>v*(mult/5));
  const names=["비명초","활력수","복원석"];
  let html="";
  for(const [grade,req] of Object.entries(targetReq)){
    const shortage=stock.map(v=>Math.max(0,req-v));
    const runs=shortage.map((v,i)=>v>0?v/per100k[i]*100000:0);
    const tickets=Math.ceil(runs.reduce((a,b)=>a+b,0)*2);
    const hours=ticketHour>0?tickets/ticketHour:(tickets===0?0:Infinity);
    html+='<div class="result">'+
      '<div class="grade">'+grade+' 1개</div>'+
      '<div class="time">'+duration(hours)+'</div>'+
      '<div class="meta">예상 필요 입장권 <b>'+fmt(tickets)+'장</b><br>'+
      '원재료 필요량 각 <b>'+fmt(req)+'개</b></div>'+
      '<div class="break">'+names.map((n,i)=>n+' 부족 '+fmt(shortage[i])+' · 소탕 약 '+fmt(Math.ceil(runs[i]))+'회').join('<br>')+'</div>'+
    '</div>';
  }
  document.getElementById("results").innerHTML=html;
}
["ticketHour","mastery","r0","r1","r2"].forEach(id=>document.getElementById(id).addEventListener("input",calculate));
calculate();
</script>
</main></body></html>
